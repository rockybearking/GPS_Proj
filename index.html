<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 실시간 내 위치 & 응급의료기관 조회</title>
    <link rel="stylesheet" href="style.css">
    <!-- 카카오맵 SDK -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=64961e084dede515b221656f5fe6600c&autoload=false"></script>
</head>

<body>

<div id="status-card">
    <strong id="status-title" style="color: #007aff;">📍 위치 확인 중...</strong><br>
    <span id="coords" style="color: #555;">브라우저 상단의 위치 권한 팝업에서 [허용]을 눌러주세요.</span>
</div>

<div id="search-box">
    <input type="text" id="keyword" placeholder="주소 검색" style="border: 1px solid #ccc; padding: 6px 10px; border-radius: 4px; outline: none;">
    <button id="search-btn" style="background: #007aff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">검색</button>
</div>

<!-- 좌측 하단 반경 선택 플로팅 메뉴 (스피드 다이얼) -->
<div id="radius-menu-wrapper">
    <!-- 클릭 시 촤르륵 펼쳐질 반경 옵션 버튼 그룹 (초기 숨김 대상) -->
    <div id="radius-options" class="radius-options">
        <button class="radius-btn" data-radius="5">5km</button>
        <button class="radius-btn active" data-radius="10">10km</button>
        <button class="radius-btn" data-radius="15">15km</button>
        <button class="radius-btn" data-radius="20">20km</button>
        <button class="radius-btn" data-radius="30">30km</button>
        <button class="radius-btn" data-radius="40">40km</button>
        <button class="radius-btn" data-radius="50">50km</button>
        <button class="radius-btn" data-radius="100">100km</button>
    </div>

    <!-- 평상시 노출되는 내 위치 버튼 크기의 원형 대표 버튼 -->
    <button id="radius-main-btn" title="탐색 반경 변경" aria-label="탐색 반경 변경">
        <!-- 동심원(반경/레이더) 아이콘 -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
        </svg>
    </button>
</div>

<!-- 좌측 하단 내 위치 이동 원형 버튼 -->
<button id="my-loc-btn" title="내 위치로 이동" aria-label="내 위치로 이동">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7"></circle>
        <line x1="12" y1="1" x2="12" y2="5"></line>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="1" y1="12" x2="5" y2="12"></line>
        <line x1="19" y1="12" x2="23" y2="12"></line>
    </svg>
</button>

<div id="map"></div>

<script src="app.js"></script>
</body>

</html>
